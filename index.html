<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Démo Agent IA Électricien - Vocal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 18px;
    }

    .container {
      max-width: 760px;
      margin: auto;
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .phone-box {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .phone-box input {
      flex: 1;
      min-width: 0;
    }

    .chat {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      height: 430px;
      overflow-y: auto;
      background: #fafafa;
      margin-bottom: 16px;
    }

    .message {
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      max-width: 82%;
      line-height: 1.4;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      background: #dbeafe;
      margin-left: auto;
      text-align: right;
    }

    .assistant {
      background: #e5e7eb;
      margin-right: auto;
    }

    .system {
      background: #fff7ed;
      color: #9a3412;
      margin: 0 auto 12px auto;
      text-align: center;
      font-size: 13px;
      max-width: 95%;
    }

    .success {
      background: #ecfdf5;
      color: #047857;
      margin: 0 auto 12px auto;
      text-align: center;
      font-size: 13px;
      max-width: 95%;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .voice-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
    }

    input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-sizing: border-box;
    }

    #message {
      flex: 1;
      min-width: 0;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
    }

    button.secondary {
      background: #6b7280;
    }

    button.voice {
      background: #2563eb;
    }

    button.stop {
      background: #991b1b;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .debug {
      margin-top: 14px;
      font-size: 12px;
      color: #555;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px;
      display: none;
      white-space: pre-wrap;
      overflow-x: auto;
    }

    @media (max-width: 640px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 14px;
      }

      h1 {
        font-size: 20px;
      }

      .phone-box,
      .controls {
        flex-direction: column;
      }

      button,
      input {
        width: 100%;
      }

      .chat {
        height: 390px;
      }

      .voice-controls {
        flex-direction: column;
        align-items: stretch;
      }

      .voice-controls label {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .voice-controls input[type="checkbox"] {
        width: auto;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Démo Agent IA Électricien</h1>
    <div class="subtitle">
      Simulation d’une conversation client avec texte, micro et réponse vocale.
    </div>

    <div class="phone-box">
      <input id="telephone" value="+33600000000" />
      <button id="resetBtn" class="secondary">Nouvelle démo</button>
    </div>

    <div id="chat" class="chat">
      <div class="message system">
        Chargement de la page...
      </div>
    </div>

    <div class="voice-controls">
      <button id="unlockVoiceBtn" class="voice">🔊 Activer la voix</button>
      <button id="micBtn" class="voice">🎙️ Parler</button>
      <button id="stopVoiceBtn" class="stop">Stop voix</button>
      <label>
        <input id="voiceEnabled" type="checkbox" checked />
        Lire la réponse à voix haute
      </label>
    </div>

    <div class="controls">
      <input id="message" placeholder="Écrire un message client..." />
      <button id="sendBtn">Envoyer</button>
    </div>

    <div id="debug" class="debug"></div>
  </div>

  <script>
    const WEBHOOK_URL = "https://othmanebelkaria.app.n8n.cloud/webhook/demo-chat";

    let recognition = null;
    let isListening = false;
    let availableVoices = [];
    let voiceUnlocked = false;
    let selectedVoiceName = "";

    function showDebug(text) {
      const debug = document.getElementById("debug");
      debug.style.display = "block";
      debug.textContent = text;
    }

    function addMessage(text, type) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function resetChat() {
      document.getElementById("chat").innerHTML = `
        <div class="message system">
          Nouvelle simulation démarrée. Changez le numéro si vous voulez repartir d’une conversation vierge.
        </div>
      `;
      document.getElementById("debug").style.display = "none";
      document.getElementById("debug").textContent = "";
      stopVoice();
    }

    function normalizePhone(value) {
      return value.replace("whatsapp:", "").trim();
    }

    function loadVoices() {
      if (!("speechSynthesis" in window)) return;

      availableVoices = window.speechSynthesis.getVoices();

      if (!availableVoices.length) {
        setTimeout(() => {
          availableVoices = window.speechSynthesis.getVoices();
          const preferredVoice = getPreferredFrenchVoice();
          if (preferredVoice) selectedVoiceName = preferredVoice.name;
        }, 800);
      } else {
        const preferredVoice = getPreferredFrenchVoice();
        if (preferredVoice) selectedVoiceName = preferredVoice.name;
      }
    }

    function getPreferredFrenchVoice() {
      if (!availableVoices.length && "speechSynthesis" in window) {
        availableVoices = window.speechSynthesis.getVoices();
      }

      const lower = voice => `${voice.name} ${voice.lang}`.toLowerCase();

      // Priorité aux voix les moins robotisées quand elles existent.
      return (
        availableVoices.find(v => lower(v).includes("microsoft denise online") && lower(v).includes("fr")) ||
        availableVoices.find(v => lower(v).includes("denise") && lower(v).includes("fr")) ||
        availableVoices.find(v => lower(v).includes("google") && lower(v).includes("fr")) ||
        availableVoices.find(v => lower(v).includes("natural") && lower(v).includes("fr")) ||
        availableVoices.find(v => lower(v).includes("online") && lower(v).includes("fr")) ||
        availableVoices.find(v => v.lang && v.lang.toLowerCase() === "fr-fr") ||
        availableVoices.find(v => v.lang && v.lang.toLowerCase().startsWith("fr")) ||
        null
      );
    }

    function buildUtterance(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "fr-FR";

      // Réglages plus naturels : un peu plus lent, moins aigu.
      utterance.rate = 0.88;
      utterance.pitch = 0.95;
      utterance.volume = 1;

      const preferredVoice = getPreferredFrenchVoice();
      if (preferredVoice) {
        utterance.voice = preferredVoice;
        selectedVoiceName = preferredVoice.name;
      }

      return utterance;
    }

    function unlockVoice() {
      if (!("speechSynthesis" in window)) {
        addMessage("La lecture vocale n’est pas supportée par ce navigateur.", "system");
        return;
      }

      loadVoices();
      window.speechSynthesis.cancel();

      const utterance = buildUtterance("Voix activée.");
      utterance.onstart = () => {
        voiceUnlocked = true;
      };

      utterance.onend = () => {
        const voiceInfo = selectedVoiceName ? "Voix utilisée : " + selectedVoiceName : "Voix activée.";
        addMessage(voiceInfo, "success");
      };

      utterance.onerror = (event) => {
        showDebug("Erreur activation voix : " + (event.error || "inconnue"));
        addMessage("La voix n’a pas pu être activée. Réessayez après avoir touché l’écran.", "system");
      };

      window.speechSynthesis.speak(utterance);
    }

    function speakText(text) {
      const voiceEnabled = document.getElementById("voiceEnabled");

      if (!voiceEnabled || !voiceEnabled.checked) return;
      if (!text) return;

      if (!("speechSynthesis" in window)) {
        addMessage("Lecture vocale non supportée par ce navigateur.", "system");
        return;
      }

      if (!voiceUnlocked) {
        addMessage("Touchez d’abord “🔊 Activer la voix” pour autoriser la lecture vocale sur mobile.", "system");
        return;
      }

      loadVoices();
      window.speechSynthesis.cancel();

      const utterance = buildUtterance(text);

      utterance.onerror = (event) => {
        showDebug("Erreur lecture vocale : " + (event.error || "inconnue"));
      };

      setTimeout(() => {
        window.speechSynthesis.speak(utterance);
      }, 200);
    }

    function stopVoice() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
    }

    async function sendMessage(forcedText = null) {
      const input = document.getElementById("message");
      const phoneInput = document.getElementById("telephone");
      const button = document.getElementById("sendBtn");

      const text = (forcedText !== null ? forcedText : input.value).trim();
      const telephone = normalizePhone(phoneInput.value);

      if (!text) {
        addMessage("Message vide, rien à envoyer.", "system");
        return;
      }

      addMessage(text, "user");

      input.value = "";
      button.disabled = true;
      button.textContent = "Envoi...";

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            telephone: telephone,
            text: text
          })
        });

        const data = await response.json();
        const reply = data.reply || "Aucune réponse reçue.";

        addMessage(reply, "assistant");
        speakText(reply);

        const debug = document.getElementById("debug");
        debug.style.display = "block";
        debug.textContent = JSON.stringify(data, null, 2);

      } catch (error) {
        addMessage("Erreur : impossible de contacter l’automatisation.", "assistant");
        showDebug(String(error));
        console.error(error);
      }

      button.disabled = false;
      button.textContent = "Envoyer";
    }

    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        document.getElementById("micBtn").disabled = true;
        addMessage("Reconnaissance vocale non supportée sur ce navigateur. Testez Chrome mobile.", "system");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = "fr-FR";
      recognition.interimResults = false;
      recognition.continuous = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById("micBtn").textContent = "🎙️ J’écoute...";
        document.getElementById("micBtn").disabled = true;
      };

      recognition.onresult = (event) => {
        let transcript = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }

        transcript = transcript.trim();
        document.getElementById("message").value = transcript;

        if (transcript) {
          setTimeout(() => {
            sendMessage(transcript);
          }, 500);
        } else {
          addMessage("Je n’ai pas compris le message vocal.", "system");
        }
      };

      recognition.onerror = (event) => {
        let message = "Erreur micro : " + event.error;

        if (event.error === "not-allowed") {
          message = "Micro refusé. Autorisez le micro dans les réglages du navigateur.";
        } else if (event.error === "no-speech") {
          message = "Aucune voix détectée. Réessayez en parlant après le clic.";
        } else if (event.error === "network") {
          message = "Erreur réseau pendant la reconnaissance vocale.";
        }

        addMessage(message, "system");
        showDebug("SpeechRecognition error: " + event.error);
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById("micBtn").textContent = "🎙️ Parler";
        document.getElementById("micBtn").disabled = false;
      };
    }

    function startListening() {
      if (!recognition) {
        addMessage("Reconnaissance vocale indisponible sur ce navigateur.", "system");
        return;
      }

      if (isListening) return;

      try {
        recognition.start();
      } catch (error) {
        showDebug("Erreur lancement micro : " + String(error));
      }
    }

    function initPage() {
      document.getElementById("chat").innerHTML = "";
      addMessage("Page prête. Touchez 🔊 Activer la voix, puis testez Envoyer ou 🎙️ Parler.", "success");

      document.getElementById("sendBtn").addEventListener("click", () => sendMessage());
      document.getElementById("micBtn").addEventListener("click", startListening);
      document.getElementById("resetBtn").addEventListener("click", resetChat);
      document.getElementById("stopVoiceBtn").addEventListener("click", stopVoice);
      document.getElementById("unlockVoiceBtn").addEventListener("click", unlockVoice);

      document.getElementById("message").addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
          sendMessage();
        }
      });

      if ("speechSynthesis" in window) {
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }

      setupSpeechRecognition();
    }

    window.addEventListener("DOMContentLoaded", initPage);
  </script>
</body>
</html>
